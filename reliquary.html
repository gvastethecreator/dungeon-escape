<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reliquary Altar · Reconstruction Review</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: #111311;
        color: #bbb9ae;
        font:
          12px ui-monospace,
          monospace;
        overflow: hidden;
      }
      main {
        display: grid;
        grid-template-columns: 1fr 1fr;
        height: 100vh;
        gap: 1px;
        background: #393b37;
      }
      .pane {
        position: relative;
        background: radial-gradient(circle at 50% 40%, #333531, #181a18 72%);
        overflow: hidden;
      }
      .pane img {
        width: 100%;
        height: 100%;
        object-fit: contain;
      }
      .pane canvas {
        width: 100%;
        height: 100%;
        display: block;
      }
      .label {
        position: absolute;
        top: 16px;
        left: 16px;
        padding: 7px 10px;
        border: 1px solid #555750;
        background: #111b;
        letter-spacing: 0.14em;
        z-index: 2;
      }
      .meta {
        position: absolute;
        bottom: 16px;
        left: 16px;
        right: 16px;
        padding: 8px 10px;
        background: #111c;
        border: 1px solid #494b46;
        color: #98998f;
        z-index: 2;
      }
      strong {
        color: #d4d0bf;
      }
    </style>
  </head>
  <body>
    <main>
      <section class="pane">
        <div class="label">01 · REFERENCIA IMAGEGEN</div>
        <img
          src="/assets/concepts/reliquary-altar-reference.png"
          alt="Referencia del altar relicario"
        />
      </section>
      <section class="pane">
        <div class="label">02 · PROCEDURAL REBUILD</div>
        <canvas id="preview"></canvas>
        <div class="meta">
          <strong>RELIQUARY ALTAR</strong> · oak / stone / iron · hinged doors · candle sockets ·
          box collider
        </div>
      </section>
    </main>
    <script type="module" src="/src/reliquary-preview.ts"></script>
  </body>
</html>
